name: Build releases

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x86_64, runner: ubuntu-22.04, arch: x86_64}
          - {target: linux-aarch64, runner: ubuntu-24.04-arm, arch: aarch64}
          - {target: windows-x86_64, runner: windows-2022, arch: x86_64}
          - {target: macos-x86_64, runner: macos-15-intel, arch: x86_64}
          - {target: macos-aarch64, runner: macos-14, arch: aarch64}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3
      - name: Install dependencies
        run: python -m pip install -c packaging/constraints-release.txt ".[release]"
      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert os.environ['RELEASE_TAG']=='v'+v, 'Tag must match pyproject.toml version'"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Download AppImage tool
        if: runner.os == 'Linux'
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          curl --fail --location --retry 3 "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-$BUILD_ARCH.AppImage" -o appimagetool.AppImage
          chmod +x appimagetool.AppImage
      - name: Build Linux and smoke-test packages
        if: runner.os == 'Linux'
        run: python packaging/build_release.py --appimage-tool ./appimagetool.AppImage
      - name: Build Windows or macOS and smoke-test package
        if: runner.os != 'Linux'
        run: python packaging/build_release.py
      - name: Upload downloads
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-source-and-wheel
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [build, source]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Create draft release with all downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "BLE Terminal $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" downloads/* --clobber
